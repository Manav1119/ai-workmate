# AI Workmate: Postgres + FastAPI + Next.js.   docker compose up --build   ->  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workmate"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/workmate
      APP_DATABASE_URL: postgresql+psycopg://workmate_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/workmate
      READONLY_DATABASE_URL: postgresql+psycopg://workmate_reader:${READONLY_DB_PASSWORD:?set READONLY_DB_PASSWORD}@db:5432/workmate
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      ALLOW_DEMO_LOGIN: ${ALLOW_DEMO_LOGIN:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
